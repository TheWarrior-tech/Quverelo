name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create/attach to a GitHub Release for the current package.json version'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (typecheck, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: End-to-end tests (Electron + Playwright)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npx playwright test
        env:
          CI: 'true'
          QUVRELO_SHOTS_DIR: test-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            test-screenshots
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.name }})
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Linux packaging tools (rpm)
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: List artefacts
        shell: bash
        run: ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.pkg
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist-installers
          merge-multiple: true
      - name: Work out tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - name: Write SHA-256 checksums
        run: cd dist-installers && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Quvrelo ${{ steps.tag.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          files: dist-installers/*
          fail_on_unmatched_files: true

  diagnose:
    name: Record failure logs (ci-logs branch)
    needs: [test, package, release]
    if: always() && (needs.test.result == 'failure' || needs.package.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Save the tail of every failed job's log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p /tmp/out
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" --jq '.jobs[] | select(.conclusion=="failure") | "\(.id)\t\(.name)"' > /tmp/failed.tsv || true
          while IFS=$'\t' read -r id name; do
            safe=$(echo "$name" | tr -c 'A-Za-z0-9' '_')
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>&1 | grep -v '^\s*$' | tail -n 120 > "/tmp/out/${safe}.txt" || true
          done < /tmp/failed.tsv
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs $(git rev-parse --verify -q origin/ci-logs || echo HEAD)
          rm -rf ci-logs-out && mkdir -p ci-logs-out
          cp /tmp/out/* ci-logs-out/ 2>/dev/null || true
          echo "run $GITHUB_RUN_ID sha $GITHUB_SHA" > ci-logs-out/RUN.txt
          git add -f ci-logs-out && git commit -m "CI logs for run $GITHUB_RUN_ID" && git push origin ci-logs
