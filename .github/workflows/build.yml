name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create/attach to a GitHub Release for the current package.json version'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (typecheck, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out QuvSelect v1 weights (orphan branch ml-models)
        uses: actions/checkout@v4
        with:
          ref: ml-models
          path: ml-models
      - name: Install QuvSelect v1 models (sha256-checked against ml/models/manifest.json; fails on mismatch or absence)
        run: node scripts/fetch-ml-models.mjs
        env:
          QUVRELO_REQUIRE_ML_MODELS: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: End-to-end tests (Electron + Playwright)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npx playwright test
        env:
          CI: 'true'
          QUVRELO_SHOTS_DIR: test-screenshots
      - uses: actions/upload-artifact@v4
        # Only needed to debug a red run; a full Actions-storage quota must never turn a green test run red.
        if: failure()
        continue-on-error: true
        with:
          name: e2e-report
          retention-days: 3
          path: |
            playwright-report
            test-results
            test-screenshots
          if-no-files-found: ignore

  # Installers are attached straight to a draft Release (not to Actions artifacts), so a full
  # Actions-storage quota can never block publishing. The release job publishes the draft.
  draft:
    name: Create draft release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft (kept if it already exists)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$(node -p "require('./package.json').version")"; fi
          PRE=""; [[ "$TAG" == *-* ]] && PRE="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; else
            gh release create "$TAG" --draft --verify-tag $PRE --title "Quvrelo $TAG" --notes-file docs/RELEASE_NOTES.md
          fi

  package:
    name: Package (${{ matrix.name }})
    needs: [test, draft]
    if: always() && needs.test.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # macOS signing + notarisation switch on only when the secrets exist (see docs/ADMIN_GUIDE.md
      # "Updates"). Without them the mac build stays unsigned and the app falls back to
      # "Download update" (Squirrel.Mac refuses unsigned apps).
      MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out QuvSelect v1 weights (orphan branch ml-models)
        uses: actions/checkout@v4
        with:
          ref: ml-models
          path: ml-models
      - name: Install QuvSelect v1 models (sha256-checked against ml/models/manifest.json; fails on mismatch or absence)
        run: node scripts/fetch-ml-models.mjs
        env:
          QUVRELO_REQUIRE_ML_MODELS: '1'
      - run: npm run build
      - name: Linux packaging tools (rpm)
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Enable macOS signing and notarisation
        if: matrix.name == 'macOS' && env.MAC_SIGNING == 'true'
        run: node scripts/ci-enable-mac-signing.mjs
      - name: Build installers
        shell: bash
        run: |
          # Empty-string secrets make electron-builder resolve CSC_LINK to the cwd ("not a file").
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_LINK: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Keep the x64 macOS update metadata (the arm64 run overwrites latest-mac.yml)
        if: matrix.name == 'macOS'
        shell: bash
        run: mv release/latest-mac.yml release/latest-mac-x64.part.yml
      - name: Build installers (macOS arm64, separate run so the two .pkg builds don't collide)
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          npx electron-builder --mac --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS app signatures (ad-hoc must be valid or macOS reports "damaged")
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          for app in release/mac*/Quvrelo.app; do
            echo "== $app"; codesign --verify --deep --strict --verbose=2 "$app"; codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier'
          done
      - name: Merge macOS update metadata (x64 + arm64 in one latest-mac.yml)
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          node scripts/merge-mac-update-info.mjs release/latest-mac-x64.part.yml release/latest-mac.yml release/latest-mac.yml
          rm release/latest-mac-x64.part.yml
      - name: List artefacts
        shell: bash
        run: ls -la release
      - name: Attach installers to the draft release
        if: needs.draft.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$(node -p "require('./package.json').version")"; fi
          shopt -s nullglob
          files=(release/*.exe release/*.msi release/*.dmg release/*.pkg release/*.AppImage release/*.deb release/*.rpm release/*.zip release/*.blockmap release/latest*.yml release/beta*.yml release/alpha*.yml)
          printf '%s\n' "${files[@]}"
          [ ${#files[@]} -gt 0 ] || { echo "no installers found"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

  flatpak:
    # Separate job so a Flatpak problem never fails the AppImage/deb/rpm, Windows or
    # macOS packages. Not continue-on-error: a failure shows up red, but the release
    # job below still publishes the other installers without it.
    name: Package (Flatpak)
    needs: [test, draft]
    if: always() && needs.test.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out QuvSelect v1 weights (orphan branch ml-models)
        uses: actions/checkout@v4
        with:
          ref: ml-models
          path: ml-models
      - name: Install QuvSelect v1 models (sha256-checked against ml/models/manifest.json; fails on mismatch or absence)
        run: node scripts/fetch-ml-models.mjs
        env:
          QUVRELO_REQUIRE_ML_MODELS: '1'
      - run: npm run build
      - name: Unpacked Linux app (input to the Flatpak manifest)
        run: npx electron-builder --linux dir --x64 --publish never
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/com.quvrelo.app.yml
      - name: Bundle Quvrelo-<version>.flatpak
        run: |
          VERSION=$(node -p "require('./package.json').version")
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "release/Quvrelo-${VERSION}.flatpak" com.quvrelo.app
          ls -la release/*.flatpak
      - name: Attach the Flatpak to the draft release
        if: needs.draft.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$(node -p "require('./package.json').version")"; fi
          gh release upload "$TAG" release/*.flatpak --clobber

  release:
    name: Publish GitHub Release
    needs: [package, flatpak, draft]
    # always(): publish even if only the Flatpak job failed; the main packages must succeed.
    if: always() && needs.package.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - name: Download every asset from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "${{ steps.tag.outputs.tag }}" --dir dist-installers --clobber
      - name: Check update metadata (latest*.yml + blockmaps for every platform)
        run: node scripts/verify-update-metadata.mjs dist-installers
      - name: Write SHA-256 checksums
        run: cd dist-installers && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release upload "$TAG" dist-installers/SHA256SUMS.txt --clobber
          LATEST="--latest"; [[ "$TAG" == *-* ]] && LATEST="--prerelease"
          # v1.2.0-beta.1 etc. are prereleases: the beta update channel sees them, stable does not.
          gh release edit "$TAG" --draft=false $LATEST --title "Quvrelo $TAG" --notes-file docs/RELEASE_NOTES.md

  diagnose:
    name: Record failure logs (ci-logs branch)
    needs: [test, draft, package, flatpak, release]
    if: always() && (needs.draft.result == 'failure' || needs.test.result == 'failure' || needs.package.result == 'failure' || needs.flatpak.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Save the tail of every failed job's log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p /tmp/out
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" --jq '.jobs[] | select(.conclusion=="failure") | "\(.id)\t\(.name)"' > /tmp/failed.tsv || true
          while IFS=$'\t' read -r id name; do
            safe=$(echo "$name" | tr -c 'A-Za-z0-9' '_')
            curl -sL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>&1 | sed "s/\x1b\[[0-9;]*[A-Za-z]//g" | grep -v '^\s*$' > "/tmp/full_${safe}.txt" || true
            { echo "=== errors / failures (grep) ==="; grep -n -E '##\[error\]|Error:|FAIL|failed|✘|exit code|timed out|Timeout' "/tmp/full_${safe}.txt" | cut -c1-300 | tail -n 60; echo "=== tail ==="; tail -n 120 "/tmp/full_${safe}.txt"; } > "/tmp/out/${safe}.txt"
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id" --jq '.steps[] | "\(.number) \(.conclusion) \(.name)"' >> "/tmp/out/${safe}.txt" || true
          done < /tmp/failed.tsv
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs $(git rev-parse --verify -q origin/ci-logs || echo HEAD)
          rm -rf ci-logs-out && mkdir -p ci-logs-out
          cp /tmp/out/* ci-logs-out/ 2>/dev/null || true
          echo "run $GITHUB_RUN_ID sha $GITHUB_SHA" > ci-logs-out/RUN.txt
          git add -f ci-logs-out && git commit -m "CI logs for run $GITHUB_RUN_ID" && git push origin ci-logs
